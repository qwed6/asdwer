<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open App</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#0f172a;
    color:#fff;
    font-family:Arial;
    text-align:center;
}
.btn{
    background:#0088cc;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}
</style>

</head>
<body>

<div>
    <h2>Continue to App</h2>
    <div class="btn" onclick="openApp()">Open Now</div>
</div>

<script>
function openApp(){
    // app open try
    window.location.href = "site://1winpbu.com";

    // fallback after delay
    setTimeout(()=>{
        window.location.href = "site://1winpbu.com/";
    }, 3000);
}
</script>

</body>
</html>
